name: Feature request
description: An idea to make the site more useful
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or the problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Carrier, example (without your full tracking number), screenshots of another site…
