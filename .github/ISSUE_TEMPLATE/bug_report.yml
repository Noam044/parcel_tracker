name: Bug report
description: Something is wrong or broken on the site
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Please **do not paste your full tracking number**: it can reveal who you are and where your parcel goes. The carrier and the shape of the number (e.g. `LP#########CN`) are enough.
        For a security problem, use **Security → Report a vulnerability** instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: carrier
    attributes:
      label: Carrier and number format
      placeholder: "China Post → La Poste, LP#########CN"
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Search / error message
        - Parcel status and key figures
        - History
        - Map
        - Recent parcels
        - Language or theme
        - Something else
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Firefox 140 on Windows, Safari on iPhone…"
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or anything else
