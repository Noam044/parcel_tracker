# Netlify n'a pas de commande de build par défaut pour ce projet : sans ce fichier, il publie le dépôt
# tel quel (sans lancer « next build ») et le site répond 404 partout.
# Les réglages de ce fichier l'emportent sur ceux de l'interface Netlify.
[build]
  command = "npm run build"
  publish = ".next"

# Adaptateur Next.js de Netlify : il transforme la sortie de « next build » en pages servies par le CDN
# et en fonction serveur pour /api/track. Netlify devrait l'installer seul, mais ce site ne l'a pas fait
# (le journal de build n'en mentionnait aucune trace) : on le déclare explicitement, sans figer de version.
[[plugins]]
  package = "@netlify/plugin-nextjs"
